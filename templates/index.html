<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Transkribering</title>
    <!-- Kobler til CSS-filen -->
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>


    <div class="container">
        <h1>Lyd til Tekst</h1>

        <div class="server-status">
            <span>AI-server status:</span>
            <div id="status-indicator" title="Sjekker status..."></div>
        </div>

        <div class="section innstillinger-rad">
            <!-- Språkvalg -->
            <div>
                <label for="spraakValg"><b>Velg språk for teksting:</b></label>
                <select id="spraakValg">
                    <option value="no" selected>Norsk</option>
                    <option value="en">Engelsk</option>
                    <option value="sv">Svensk</option>
                    <option value="da">Dansk</option>
                    <option value="de">Tysk </option>
                </select>
            </div>

            <p></p>
            <!-- Valg av Modell-->
            <div>
                <label for="modellValg"><b> AI Modell:</b></label>
                <select id="modellValg">
                    <option value="tiny">Tiny (Rask, unøyaktig)</option>
                    <option value="base" selected>Base (Balansert)</option>
                    <option value="small">Small (Treg, nøyaktig)</option>
                    <option value="medium">Medium (Tregest, mest nøyaktig)</option>
                </select>
            </div>

            <p></p>
            <!-- Valg av Kjerner -->
            <div>
                <label for="kjernerValg"><b>Velg antall CPU kjerner:</b></label>
                <select id="kjernerValg">
                    <option value="1">1</option>
                    <option value="2" selected>2 (best)</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" >5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8 (alle) </option>
                </select>
            </div>
        </div>

        <!-- Opptaksknapper -->
        <div class="section">
            <p>Spill inn lyd direkte fra mikrofonen din:</p>
            <button id="startOpptak">Start opptak</button>
            <button id="stoppOpptak" class="stop" disabled> Stopp & Transkriber</button>
        </div>


        <hr>

        <!-- Vanlig filopplasting -->
        <form id="filSkjema">
            <p>Eller last opp en eksisterende fil (Max 50MB):</p>
            <input type="file" id="lydFil" accept="audio/*,video/*" required>
            <button type="submit">Transkriber fil</button>
        </form>

        <!-- Status og resultat -->
        <div id="status"></div>
        <div id="tidsbruk"> Tid gått: 0.0 sekunder</div>
        <div id="resultat">Transkripsjonen dukker opp her...</div>

        <div style="text-align: right; margin-bottom: 10px;">
            <a href="/historikk" class="nav-lenke">Gå til historikk </a>
        </div>
    </div>

    <!-- Kobler til JavaScript-filen -->
    <script src="/static/script.js?=v6"></script>
</body>
</html>
